[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geocoder_reverse_natural_earth"
version = "0.0.3.dev0"
authors = [{ name = "MET Norway" }]
description = "implementations of geocoder_reverse using natural_earth shape-files"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
dependencies = ["fiona", "shapely", "rtree"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/metno/geocoder_reverse_natural_earth"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["geocoder_reverse_natural_earth"]

[tool.setuptools.package-data]
geocoder_reverse_natural_earth = ["*.zip"]

[tool.tox]
requires = ["tox>=4.0"]
env_list = ["py312", "format"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
commands = [["python3", "-m", "unittest", "discover", "-s", "tests"]]

[tool.tox.env.format]
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit"]
